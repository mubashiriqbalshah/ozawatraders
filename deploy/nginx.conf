# /etc/nginx/sites-available/ozawatraders
# After editing: sudo ln -s /etc/nginx/sites-available/ozawatraders /etc/nginx/sites-enabled/
#                sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ozawatraders.org www.ozawatraders.org;

    # Let's Encrypt ACME challenge (must stay on HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS reverse proxy to Node.js on :8000
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ozawatraders.org www.ozawatraders.org;

    # SSL — populated by certbot
    ssl_certificate /etc/letsencrypt/live/ozawatraders.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ozawatraders.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # File upload size for admin (banner images, etc.)
    client_max_body_size 15M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static assets — let Nginx serve directly with caching
    location ~* ^/(img|css|js|fonts|uploads)/ {
        root /var/www/ozawatraders;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri @node;
    }

    # Everything else → Node.js
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location @node {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block hidden files (.env, .git, etc.)
    location ~ /\. { deny all; }
}
